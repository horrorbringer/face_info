name: CI/CD Pipeline & Auto Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DJANGO_SECRET_KEY: "ci-testing-secret-key-face-info"
          DJANGO_DEBUG: "True"
        run: |
          python manage.py test

  deploy:
    name: Deploy to Production (Native)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "===> Starting automated production deployment..."
            cd /home/ubuntu/face_info

            # 1. Fetch and pull latest changes
            git pull origin main

            # 2. Activate virtualenv and update packages
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # 3. Apply database migrations
            python manage.py migrate --noinput

            # 4. Gather static files
            python manage.py collectstatic --noinput

            # 5. Ensure directory permissions remain valid for Nginx
            chmod 755 /home/ubuntu
            chmod -R 755 /home/ubuntu/face_info/staticfiles

            # 6. Restart systemd services
            sudo systemctl restart faceinfo-web.service faceinfo-celery.service

            # 7. Check services health
            systemctl is-active --quiet faceinfo-web.service && echo "✓ faceinfo-web.service is running"
            systemctl is-active --quiet faceinfo-celery.service && echo "✓ faceinfo-celery.service is running"

            echo "===> Deployment completed successfully!"
