services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: faceinfo
      POSTGRES_USER: faceinfo
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://faceinfo:change-me@db:5432/faceinfo
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:

