<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance System — API Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-bar {
      background: #1e293b;
      padding: 1rem 2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-bar h1 {
      font-size: 1.25rem;
      margin: 0;
      color: #38bdf8;
      font-weight: 700;
    }
    .top-bar a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1.5rem;
      transition: color 0.2s;
    }
    .top-bar a:hover {
      color: #38bdf8;
    }
    #swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #ffffff;
      border-radius: 8px;
      margin-top: 2rem;
      margin-bottom: 3rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <h1>⚡ Smart Attendance System API</h1>
      <span style="font-size: 0.8rem; color: #94a3b8;">REST API Reference & Interactive Console (v1)</span>
    </div>
    <div>
      <a href="/api/">API Root (JSON)</a>
      <a href="/api/health/">Health Status</a>
      <a href="/recognition/kiosk/">Kiosk</a>
      <a href="/students/">Students</a>
      <a href="/admin/">Django Admin</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/api/schema/",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        requestInterceptor: function(req) {
          if (req.headers && req.headers['Authorization']) {
            var auth = req.headers['Authorization'].trim();
            if (!auth.startsWith('Token ') && !auth.startsWith('Bearer ')) {
              req.headers['Authorization'] = 'Token ' + auth;
            }
          }
          return req;
        }
      });
    };
  </script>
</body>
</html>
