<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Info</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">Face Info</a>{% if user.is_authenticated %}<div><a class="text-white me-3" href="{% url 'students:manual_lookup' %}">Manual lookup</a>{% if perms.students.change_student %}<a class="text-white me-3" href="{% url 'students:import' %}">Import</a><a class="text-white me-3" href="/admin/">Admin</a>{% endif %}<form class="d-inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Log out</button></form></div>{% endif %}</div></nav>
<main class="container py-4">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
